<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AtCoder Pulse - Live Interactive Demo</title>
  <!-- AtCoder Base Glyphicons & Styles Simulation -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
  <link rel="stylesheet" href="content/content.css">
  <style>
    body {
      background-color: #030712;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 30px 15px;
    }
    .demo-header {
      max-width: 1100px;
      margin: 0 auto 25px auto;
      text-align: center;
    }
    .demo-header h1 {
      font-size: 32px;
      font-weight: 800;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .demo-input-bar {
      max-width: 500px;
      margin: 20px auto;
      display: flex;
      gap: 10px;
    }
    .demo-input {
      flex: 1;
      background: #111827;
      border: 1px solid #374151;
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    .demo-input:focus {
      border-color: #38bdf8;
    }
    .demo-btn {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .demo-btn:hover {
      background: #0369a1;
    }
    .demo-quick-handles {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 10px;
    }
    .demo-quick-link {
      color: #38bdf8;
      cursor: pointer;
      text-decoration: underline;
      margin: 0 4px;
    }
    #dashboard-mount {
      max-width: 1100px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div class="demo-header">
    <h1>⚡ AtCoder Pulse Preview</h1>
    <p class="text-muted">Test the full analytics dashboard, difficulty charts, and unsolved tracker with live AtCoder data.</p>
    
    <div class="demo-input-bar">
      <input type="text" id="demo-handle" class="demo-input" placeholder="Enter handle (e.g. tourist, chokudai)..." value="chokudai" />
      <button id="demo-load-btn" class="demo-btn">Analyze Profile</button>
    </div>

    <div class="demo-quick-handles">
      Try handles: 
      <span class="demo-quick-link" onclick="loadHandle('chokudai')">chokudai</span> • 
      <span class="demo-quick-link" onclick="loadHandle('tourist')">tourist</span> • 
      <span class="demo-quick-link" onclick="loadHandle('jiangly')">jiangly</span> • 
      <span class="demo-quick-link" onclick="loadHandle('maroonrk')">maroonrk</span>
    </div>
  </div>

  <!-- Mounting Point for Dashboard -->
  <div id="dashboard-mount"></div>

  <!-- Scripts -->
  <script src="utils/colors.js"></script>
  <script src="utils/db.js"></script>
  <script src="utils/api.js"></script>
  <script src="utils/charts.js"></script>
  <script src="utils/analyzer.js"></script>
  <script src="content/dashboard.js"></script>

  <script>
    let currentDashboard = null;

    async function loadHandle(handle) {
      document.getElementById('demo-handle').value = handle;
      const mount = document.getElementById('dashboard-mount');
      mount.innerHTML = '';
      currentDashboard = new AtCoderDashboard(handle, mount);
      await currentDashboard.loadInitialData();
    }

    document.getElementById('demo-load-btn').addEventListener('click', () => {
      const h = document.getElementById('demo-handle').value.trim();
      if (h) loadHandle(h);
    });

    document.getElementById('demo-handle').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const h = document.getElementById('demo-handle').value.trim();
        if (h) loadHandle(h);
      }
    });

    // Auto-load default
    window.addEventListener('DOMContentLoaded', () => {
      loadHandle('chokudai');
    });
  </script>
</body>
</html>
